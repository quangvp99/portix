<aside [class.sidebar]="true" [class.collapsed]="isCollapsed">
  <!-- Logo -->
  <div class="logo-section">
    <div class="logo">
      <span class="icon">📊</span>
      <span *ngIf="!isCollapsed" class="text">Portix</span>
    </div>
    <button (click)="toggleSidebar()" class="toggle-btn" [title]="isCollapsed ? 'Expand' : 'Collapse'">
      <span *ngIf="!isCollapsed">‹</span>
      <span *ngIf="isCollapsed">›</span>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="nav-menu">
    <!-- Main Section -->
    <div class="nav-section">
      <div *ngIf="!isCollapsed" class="section-label">Main</div>
      <a 
        *ngFor="let item of navItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="nav-item"
        [title]="isCollapsed ? item.label : ''"
      >
        <span class="icon">{{ item.icon }}</span>
        <span *ngIf="!isCollapsed" class="label">{{ item.label }}</span>
        <span *ngIf="item.badge && !isCollapsed" class="badge">{{ item.badge }}</span>
      </a>
    </div>
  </nav>

  <!-- User Section -->
  <div class="user-section">
    <div class="user-profile">
      <div class="avatar">👤</div>
      <div *ngIf="!isCollapsed" class="user-info">
        <p class="name">User Name</p>
        <p class="email">userportix.io</p>
      </div>
    </div>
    <div *ngIf="!isCollapsed" class="user-actions">
      <a routerLink="/profile" class="action-btn" title="Settings">⚙️</a>
      <button (click)="logout()" class="action-btn logout-btn" title="Logout">⏻</button>
    </div>
  </div>
</aside>
